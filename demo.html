<style>
/* Layout: sticky search header over a left rail (desktop) or bottom tab bar (phone); content is a single scannable column of cards and lists. */
:root {
  --bg: #f6f3f3;
  --surface: #ffffff;
  --sunk: #efe9ea;
  --ink: #1d1517;

  --ok: #1d7448;
  --ok-soft: #e1f2e8;
  --warn: #9a5800;
  --warn-soft: #fbeed8;
  --crit: #b3261e;
  --shadow: 0 1px 2px rgba(40, 10, 16, .06), 0 8px 24px rgba(40, 10, 16, .08);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Public Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141012; --surface: #1e181a; --sunk: #191315; --ink: #f3eded; --muted: #ab9ca0; --line: #352a2d;
    --brand: #e45a70; --brand-strong: #f07f91; --brand-ink: #1a0a0e; --brand-soft: #3b1c23;
    --ok: #5fcf93; --ok-soft: #173426; --warn: #f0b056; --warn-soft: #3a2a12; --crit: #ff7b72;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141012; --surface: #1e181a; --sunk: #191315; --ink: #f3eded; --muted: #ab9ca0; --line: #352a2d;
  --brand: #e45a70; --brand-strong: #f07f91; --brand-ink: #1a0a0e; --brand-soft: #3b1c23;
  --ok: #5fcf93; --ok-soft: #173426; --warn: #f0b056; --warn-soft: #3a2a12; --crit: #ff7b72;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.15; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(26px, 4vw, 34px); font-weight: 800; letter-spacing: -.01em; }
h2 { font-size: 20px; font-weight: 600; }
h3 { font-size: 16px; font-weight: 600; font-family: var(--f-body); }
p { margin: 0; }
a { color: var(--brand); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; border-radius: 6px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: .92em; }
.eyebrow { font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ---------- Login ---------- */
.login { min-height: 100vh; display: grid; grid-template-columns: 1.1fr 1fr; }
.login-art { background: var(--brand); color: #fff; padding-block: 48px; display: flex; flex-direction: column; justify-content: space-between; gap: 40px; position: relative; overflow: hidden; }
.login-art .wordmark { font-family: var(--f-display); font-weight: 800; font-size: 22px; letter-spacing: -.01em; }
.login-art h1 { font-size: clamp(34px, 5vw, 56px); max-width: 12ch; color: #fff; }
.login-art p { max-width: 42ch; opacity: .9; font-size: 16px; }
.ticker { display: flex; flex-wrap: wrap; gap: 8px; max-width: 520px; }
.ticker span { border: 1px solid rgba(255,255,255,.35); border-radius: 999px; padding: 6px 12px; font-size: 13px; background: rgba(255,255,255,.08); }
.login-form-wrap { display: flex; align-items: center; justify-content: center; padding-block: 40px; background: var(--bg); }
.login-form { width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 18px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-weight: 600; font-size: 14px; }
.field input { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 12px 14px; font-size: 16px; }
.field input:focus { outline: 2px solid var(--brand); border-color: transparent; }
.demo-warning { background: var(--warn-soft); color: var(--ink); border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent); border-radius: 10px; padding: 12px 14px; font-size: 13.5px; display: flex; gap: 10px; }
.demo-warning strong { color: var(--warn); }
.btn { border: 0; border-radius: 10px; padding: 12px 16px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
.btn-primary { background: var(--brand); color: var(--brand-ink); }
.btn-primary:hover { background: var(--brand-strong); }
.btn-ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn-ghost:hover { background: var(--sunk); }
.btn-sm { padding: 7px 12px; font-size: 13.5px; border-radius: 8px; }
.login-foot { font-size: 12.5px; color: var(--muted); }

/* ---------- App shell ---------- */
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh; }
.rail { position: sticky; top: 0; height: 100vh; border-right: 1px solid var(--line); background: var(--surface); padding: 20px 14px; display: flex; flex-direction: column; gap: 4px; }
.rail .wordmark { font-family: var(--f-display); font-weight: 800; font-size: 18px; color: var(--brand); padding: 4px 10px 18px; word-break: break-all; }
.nav-btn { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; border: 0; background: transparent; text-align: left; font-weight: 600; color: var(--muted); }
.nav-btn svg { width: 20px; height: 20px; flex: none; }
.nav-btn:hover { background: var(--sunk); color: var(--ink); }
.nav-btn[aria-current="page"] { background: var(--brand-soft); color: var(--brand); }
.rail-foot { margin-top: auto; font-size: 12px; color: var(--muted); padding: 10px; }
.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.topbar-inner { display: flex; align-items: center; gap: 12px; padding-block: 12px; max-width: 1080px; }
.mobile-mark { display: none; font-family: var(--f-display); font-weight: 800; color: var(--brand); font-size: 16px; }
.search { flex: 1; min-width: 0; position: relative; }
.search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); pointer-events: none; }
.search input { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 11px 16px 11px 40px; font-size: 15.5px; }
.search input:focus { outline: 2px solid var(--brand); border-color: transparent; background: var(--surface); }
.help-now { border: 0; background: var(--crit); color: #fff; border-radius: 999px; padding: 9px 14px; font-weight: 700; font-size: 13.5px; white-space: nowrap; }
:root[data-theme="dark"] .help-now { color: #1a0a0e; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .help-now { color: #1a0a0e; } }
.avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--brand); color: var(--brand-ink); display: grid; place-items: center; font-weight: 700; border: 0; flex: none; }
.proto-tag { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--warn); background: var(--warn-soft); padding: 3px 8px; border-radius: 6px; white-space: nowrap; }
.content { padding-block: 24px 96px; max-width: 1080px; width: 100%; display: flex; flex-direction: column; gap: 28px; }
.tabbar { display: none; }

/* ---------- Home ---------- */
.hello { display: flex; flex-direction: column; gap: 6px; }
.section { display: flex; flex-direction: column; gap: 12px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.sample-note { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.sample-note::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--warn); }
.acct-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.acct { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 8px; text-align: left; }
button.acct:hover { border-color: var(--brand); }
.acct .label { font-size: 13px; color: var(--muted); font-weight: 600; }
.acct .value { font-family: var(--f-display); font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; }
.acct .sub { font-size: 13px; color: var(--muted); }
.acct .go { font-size: 13px; font-weight: 700; color: var(--brand); margin-top: auto; }
.meter { height: 6px; border-radius: 99px; background: var(--sunk); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--brand); border-radius: 99px; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.ok { color: var(--ok); background: var(--ok-soft); }
.pill.warn { color: var(--warn); background: var(--warn-soft); }
.pill.closed { color: var(--muted); background: var(--sunk); }
.pill.na { color: var(--muted); background: var(--sunk); }
.pill.na::before { display: none; }
.try { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 13px; font-size: 14px; font-weight: 500; }
.chip:hover { border-color: var(--brand); color: var(--brand); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.cat { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 10px; text-align: left; }
.cat:hover { border-color: var(--brand); }
.cat .ico { width: 36px; height: 36px; border-radius: 10px; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center; }
.cat .ico svg { width: 20px; height: 20px; }
.cat b { font-size: 14.5px; }
.cat small { color: var(--muted); font-size: 12.5px; }

/* ---------- Lists ---------- */
.list { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.row { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 14px 16px; border: 0; border-top: 1px solid var(--line); background: transparent; text-align: left; width: 100%; }
.row:first-child { border-top: 0; }
.row:hover { background: var(--sunk); }
.row .ico { width: 40px; height: 40px; border-radius: 10px; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center; }
.row .ico svg { width: 20px; height: 20px; }
.row .t { font-weight: 700; }
.row .s { font-size: 13.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.row .meta { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.row .where { font-size: 12px; color: var(--muted); }
.filters { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.filters .chip { flex: none; }
.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r); padding: 28px; text-align: center; color: var(--muted); display: flex; flex-direction: column; gap: 10px; align-items: center; }
.count { font-size: 13px; color: var(--muted); }
mark { background: var(--brand-soft); color: inherit; border-radius: 3px; padding: 0 2px; }

/* ---------- Orgs ---------- */
.org-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
.org { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; gap: 12px; align-items: center; }
.org .mono-badge { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; font-weight: 800; font-family: var(--f-display); background: var(--sunk); color: var(--ink); flex: none; font-size: 14px; }
.org .body { min-width: 0; flex: 1; }
.org .body b { display: block; font-size: 14.5px; }
.org .body small { color: var(--muted); font-size: 12.5px; }
.follow { border: 1px solid var(--line); background: transparent; border-radius: 8px; padding: 6px 10px; font-size: 13px; font-weight: 700; flex: none; }
.follow[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.callout { background: var(--brand-soft); border-radius: var(--r); padding: 16px; display: flex; gap: 14px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.callout p { max-width: 60ch; }

/* ---------- Account ---------- */
.profile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.profile .avatar { width: 56px; height: 56px; font-size: 20px; }
.kv { display: grid; grid-template-columns: minmax(120px, 200px) minmax(0, 1fr); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.kv div { padding: 11px 16px; border-top: 1px solid var(--line); }
.kv div:nth-child(-n+2) { border-top: 0; }
.kv div:nth-child(odd) { color: var(--muted); font-size: 13.5px; font-weight: 600; }
.linked { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--ok); }
.linked::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; }

/* ---------- Sheet ---------- */
.scrim { position: fixed; inset: 0; background: rgba(20, 8, 12, .45); z-index: 40; display: flex; justify-content: flex-end; }
.sheet { background: var(--surface); width: min(460px, 100%); height: 100%; overflow-y: auto; padding: 22px 22px calc(28px + env(safe-area-inset-bottom, 0px)); padding-right: max(22px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 18px; box-shadow: var(--shadow); animation: slideIn .22s ease-out; }
.sheet > * { flex-shrink: 0; }
.fact .pill { align-self: flex-start; }
@keyframes slideIn { from { transform: translateX(24px); opacity: .6; } to { transform: none; opacity: 1; } }
.sheet-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.x { border: 0; background: var(--sunk); width: 36px; height: 36px; border-radius: 50%; font-size: 20px; line-height: 1; flex: none; }
.facts { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.fact { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 12px; padding: 12px 14px; border-top: 1px solid var(--line); align-items: start; }
.fact:first-child { border-top: 0; }
.fact svg { width: 20px; height: 20px; color: var(--brand); margin-top: 1px; }
.fact .k { font-size: 12px; color: var(--muted); font-weight: 600; }
.phone-line { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.copy { border: 1px solid var(--line); background: transparent; border-radius: 7px; padding: 3px 9px; font-size: 12px; font-weight: 700; }
.hours-tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.hours-tbl td { padding: 2px 0; }
.hours-tbl td:last-child { text-align: right; font-family: var(--f-mono); font-size: 12.5px; }
.hours-tbl tr.today td { font-weight: 700; color: var(--brand); }
.bul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }
.source { font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; }
.source a { word-break: break-all; }
.crisis-list { display: flex; flex-direction: column; gap: 10px; }
.crisis { border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.crisis .num { font-family: var(--f-mono); font-size: 18px; font-weight: 500; user-select: all; }
.crisis.top { border-color: var(--crit); }
.crisis.top .num { color: var(--crit); }

.footer { font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 16px; max-width: 75ch; display: flex; flex-direction: column; gap: 6px; }
.toast { position: fixed; left: 50%; bottom: calc(88px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; font-weight: 600; z-index: 60; box-shadow: var(--shadow); }

/* ---------- Responsive ---------- */
@media (max-width: 860px) {
  .login { grid-template-columns: 1fr; }
  .login-art { padding-block: 32px; gap: 24px; }
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { display: none; }
  .mobile-mark { display: block; }
  .topbar-inner { flex-wrap: wrap; }
  .search { order: 5; flex-basis: 100%; }
  .topbar-inner .spacer { flex: 1; }
  .tabbar { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); justify-content: space-around; }
  .tabbar .nav-btn { flex-direction: column; gap: 3px; font-size: 11px; padding: 9px 4px 8px; flex: 1; align-items: center; border-radius: 0; }
  .tabbar .nav-btn[aria-current="page"] { background: transparent; }
  .scrim { align-items: flex-end; }
  .sheet { width: 100%; height: auto; max-height: 90vh; border-radius: 18px 18px 0 0; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); animation-name: slideUp; }
  @keyframes slideUp { from { transform: translateY(30px); opacity: .6; } to { transform: none; opacity: 1; } }
  .row { grid-template-columns: 36px minmax(0, 1fr); }
  .row .ico { width: 36px; height: 36px; }
  .row .meta { grid-column: 2; flex-direction: row; align-items: center; justify-content: flex-start; flex-wrap: wrap; }
  .kv { grid-template-columns: minmax(0, 1fr); }
  .kv div:nth-child(2) { border-top: 1px solid var(--line); }
  .kv div:nth-child(odd) { padding-bottom: 0; }
  .kv div:nth-child(even) { border-top: 0; padding-top: 2px; }
  .kv div:first-child { border-top: 0; }
}
@media (max-width: 420px) {
  .proto-tag { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

<script>

const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = (n) => "$" + n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const $ = (sel, el = document) => el.querySelector(sel);
const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

function nowChicago() {
  try {
    const parts = new Intl.DateTimeFormat("en-US", { timeZone: "America/Chicago", weekday: "short", hour: "numeric", minute: "numeric", hourCycle: "h23" }).formatToParts(new Date());
    const get = (t) => (parts.find(p => p.type === t) || {}).value;
    return { day: DAYS.indexOf(get("weekday")), min: (parseInt(get("hour"), 10) % 24) * 60 + parseInt(get("minute"), 10) };
  } catch (e) { const d = new Date(); return { day: d.getDay(), min: d.getHours() * 60 + d.getMinutes() }; }
}
function fmtMin(m) {
  if (m === 1440 || m === 0) return "midnight";
  if (m === 720) return "noon";
  const hr = Math.floor(m / 60), mn = m % 60, ap = hr >= 12 ? "PM" : "AM";
  return ((hr % 12) || 12) + (mn ? ":" + String(mn).padStart(2, "0") : "") + " " + ap;
}
function status(r) {
  if (!r.hours) return null;
  const { day, min } = nowChicago();
  if (r.hours.some(x => x.o === 0 && x.c === 1440 && x.days.length === 7)) return { open: true, text: "Open 24/7" };
  for (const x of r.hours) if (x.days.includes(day) && min >= x.o && min < x.c) return { open: true, text: "Open · closes " + fmtMin(x.c) };
  for (let i = 0; i < 8; i++) {
    const d = (day + i) % 7;
    const opts = r.hours.filter(x => x.days.includes(d) && (i > 0 || x.o > min)).sort((a, b) => a.o - b.o);
    if (opts.length) return { open: false, text: "Closed · opens " + (i === 0 ? "" : i === 1 ? "tomorrow " : DAYS[d] + " ") + fmtMin(opts[0].o) };
  }
  return { open: false, text: "Closed" };
}
function statusPill(r) {
  const s = status(r);
  if (!s) return '<span class="pill na">Hours on website</span>';
  return '<span class="pill ' + (s.open ? "ok" : "closed") + '">' + esc(s.text) + "</span>";
}
function hoursTable(r) {
  const today = nowChicago().day;
  return '<table class="hours-tbl"><tbody>' + [1, 2, 3, 4, 5, 6, 0].map(d => {
    const xs = r.hours.filter(x => x.days.includes(d));
    const txt = xs.length ? xs.map(x => (x.o === 0 && x.c === 1440) ? "24 hours" : fmtMin(x.o) + " – " + fmtMin(x.c)).join(", ") : "Closed";
    return '<tr class="' + (d === today ? "today" : "") + '"><td>' + DAYS[d] + "</td><td>" + esc(txt) + "</td></tr>";
  }).join("") + "</tbody></table>";
}

/* ===== Search ===== */
const STOP = new Set("i a an the my me to for of in on at and or is it im i'm can cant can't do does how where what who need want get help with find some".split(" "));
function terms(q) { return q.toLowerCase().replace(/[^a-z0-9' -]/g, " ").split(/\s+/).filter(t => t && !STOP.has(t)); }
function score(r, ts) {
  if (!ts.length) return 0;
  const name = r.name.toLowerCase(), tags = r.tags, sum = r.summary.toLowerCase(), cat = CATS[r.cat].label.toLowerCase();
  const det = ((r.details || []).join(" ") + " " + (r.location || "")).toLowerCase();
  let s = 0, hit = 0;
  for (const t of ts) {
    let ts0 = 0;
    if (t.length < 3) {
      /* short words like "ac" or "it" only count as whole words */
      const w = new RegExp("\\b" + t + "\\b");
      if (w.test(name)) ts0 += 6;
      if (w.test(tags)) ts0 += 4;
      if (ts0) hit++;
      s += ts0;
      continue;
    }
    const stem = t.length > 4 ? t.replace(/(ing|ed|es|s)$/, "") : t;
    if (name.includes(t)) ts0 += 6; else if (name.includes(stem)) ts0 += 4;
    if ((" " + tags + " ").includes(" " + t)) ts0 += 4; else if (tags.includes(stem)) ts0 += 2;
    if (sum.includes(stem)) ts0 += 2;
    if (cat.includes(stem)) ts0 += 2;
    if (det.includes(stem)) ts0 += 1;
    if (ts0) hit++;
    s += ts0;
  }
  return hit ? s * (hit / ts.length) : 0;
}
function search(q) {
  const ts = terms(q);
  return R.map(r => ({ r, s: score(r, ts) })).filter(x => x.s > 0).sort((a, b) => b.s - a.s).map(x => x.r);
}
function orgSearch(q) {
  const ts = terms(q);
  if (!ts.length) return [];
  return ORGS.filter(o => ts.every(t => (o.name + " " + o.type).toLowerCase().includes(t)));
}
function hl(text, q) {
  const ts = terms(q).filter(t => t.length > 2);
  let out = esc(text);
  if (!ts.length) return out;
  const re = new RegExp("(" + ts.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")", "gi");
  return out.replace(re, "<mark>$1</mark>");
}

    <section class="section"><h2>Get involved</h2><div class="list">${["osil", "asg", "cce", "multicultural"].map(id => rowHtml(byId[id])).join("")}</div></section>`;
}

function viewSaved() {
  const list = R.filter(r => S.saved.has(r.id));
  return `<section class="section"><h1>Saved</h1><p class="muted">Resources you've starred. Tap the star in any listing to add or remove it.</p></section>
    ${list.length ? `<div class="list">${list.map(r => rowHtml(r)).join("")}</div>` : `<div class="empty"><b style="color:var(--ink)">No saved resources yet.</b><span>Open any resource and tap <b>Save</b> to keep it here.</span><button class="btn btn-ghost btn-sm" data-nav2="browse">Browse the directory</button></div>`}`;
}

function viewAccount() {
  return `<section class="section"><h1>Account</h1></section>
    <div class="profile">
      <span class="avatar" aria-hidden="true">${esc((ME.first[0] + ME.last[0]).toUpperCase())}</span>
      <div style="display:flex;flex-direction:column;gap:2px;min-width:0">
        <b style="font-size:18px">${esc(ME.first)} ${esc(ME.last)}</b>
        <span class="muted">Signed in as <span class="mono">${esc(S.user || "demo.student")}</span></span>
        <span class="linked">Student account connected (simulated)</span>
      </div>
    </div>
    <section class="section">
      <div class="section-head"><h2>Student profile</h2><span class="sample-note">Sample data for the demo</span></div>
      <div class="kv">
        <div>Student ID</div><div class="mono">${esc(ME.id)}</div>
        <div>Class</div><div>${esc(ME.classYear)}</div>
        <div>Major</div><div>${esc(ME.major)}</div>
        <div>College</div><div>${esc(ME.college)}</div>
        <div>Residence hall</div><div>${esc(ME.hall)}</div>
        <div>Meal plan</div><div>${esc(ME.meal.plan)} · ${money(ME.dining)} dining dollars</div>
        <div>Balance due</div><div class="mono">${money(ME.balance)}</div>
      </div>
    </section>
    <section class="section">
      <h2>How the account link would work</h2>
      <p class="muted" style="max-width:65ch">In this prototype, nothing connects to real university systems. A launched version would use the university's single sign-on, so students never give their password to ${APP_NAME}, and would read balances and schedules only with the student's permission.</p>
    </section>
    <div class="btn-row">
      <button class="btn btn-ghost" id="resetDemo">Reset demo</button>
      <button class="btn btn-primary" id="signOut">Sign out</button>
    </div>`;
}

function bindView(v) {
  v.querySelectorAll("[data-open]").forEach(b => b.addEventListener("click", () => openSheet(b.dataset.open)));
  v.querySelectorAll("[data-try]").forEach(b => b.addEventListener("click", () => go("browse", { q: b.dataset.try, cat: null })));
  v.querySelectorAll("[data-cat]").forEach(b => b.addEventListener("click", () => go("browse", { cat: b.dataset.cat || null, q: S.view === "browse" ? S.q : "" })));
  v.querySelectorAll("[data-otype]").forEach(b => b.addEventListener("click", () => { S.orgType = b.dataset.otype; renderView(); }));
  v.querySelectorAll("[data-nav2]").forEach(b => b.addEventListener("click", () => go(b.dataset.nav2, { cat: null })));
  v.querySelectorAll("[data-join]").forEach(b => b.addEventListener("click", () => {
    const id = b.dataset.join;
    if (S.joined.has(id)) S.joined.delete(id); else S.joined.add(id);
    store.set("joined", [...S.joined]);
    toast(S.joined.has(id) ? "Following" : "Unfollowed");
    renderView();
  }));
  const so = $("#signOut", v);
  if (so) so.addEventListener("click", () => { S.user = null; store.set("user", null); renderLogin(); });
  const rd = $("#resetDemo", v);
  if (rd) rd.addEventListener("click", () => {
    store.clear();
    S.saved = new Set(ME.saved); S.joined = new Set(ME.orgs); S.user = null; S.q = ""; S.cat = null; S.orgType = "All";
    renderLogin();
  });
}

/* ===== Detail sheet ===== */
function closeSheet() { const host = $("#sheetHost"); if (host) host.innerHTML = ""; document.removeEventListener("keydown", escClose); if (S.lastFocus) try { S.lastFocus.focus(); } catch (e) {} }
function escClose(e) { if (e.key === "Escape") closeSheet(); }
function mountSheet(inner, label) {
  S.lastFocus = document.activeElement;
  const host = $("#sheetHost");
  host.innerHTML = `<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(label)}">${inner}</div></div>`;
  $("#scrim").addEventListener("click", (e) => { if (e.target.id === "scrim") closeSheet(); });
  host.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", closeSheet));
  host.querySelectorAll("[data-copy]").forEach(b => b.addEventListener("click", () => copy(b.dataset.copy, b)));
  document.addEventListener("keydown", escClose);
  const x = host.querySelector(".x"); if (x) x.focus();
}

function openSheet(id) {
  const r = byId[id];
  if (!r) return;
  const saved = S.saved.has(r.id);
  const facts = [];
  if (r.location) facts.push(`<div class="fact">${svg("pin")}<div><div class="k">Location</div>${esc(r.location)}</div></div>`);
  if (r.hours) facts.push(`<div class="fact">${svg("clock")}<div style="display:flex;flex-direction:column;gap:6px"><div class="k">Regular hours</div>${statusPill(r)}${hoursTable(r)}</div></div>`);
  (r.phones || []).forEach(p => {
    const digits = p.n.split(",")[0].split(" (")[0];
    facts.push(`<div class="fact">${svg("phone")}<div><div class="k">${esc(p.l)}</div><div class="phone-line"><span class="mono" style="user-select:all">${esc(p.n)}</span><button class="copy" data-copy="${esc(digits)}">Copy</button></div></div></div>`);
  });
  if (r.email) facts.push(`<div class="fact">${svg("mail")}<div><div class="k">Email</div><div class="phone-line"><span class="mono" style="user-select:all">${esc(r.email)}</span><button class="copy" data-copy="${esc(r.email)}">Copy</button></div></div></div>`);
  if (r.web) facts.push(`<div class="fact">${svg("link")}<div><div class="k">Website</div><a href="${esc(r.web)}" target="_blank" rel="noopener">${esc(r.web.replace(/^https?:\/\//, "").replace(/\/$/, ""))}</a></div></div>`);
  const inner = `
    <div class="sheet-top">
      <div style="display:flex;flex-direction:column;gap:6px;min-width:0">
        <span class="eyebrow">${esc(CATS[r.cat].label)}</span>
        <h2 style="font-size:24px">${esc(r.name)}</h2>
      </div>
      <button class="x" data-close aria-label="Close">×</button>
    </div>
    <p>${esc(r.summary)}</p>
    <div class="btn-row">
      <button class="btn btn-primary btn-sm" id="saveBtn" aria-pressed="${saved}">${saved ? "★ Saved" : "☆ Save"}</button>
      ${r.web ? `<a class="btn btn-ghost btn-sm" href="${esc(r.web)}" target="_blank" rel="noopener">Visit website</a>` : ""}
    </div>
    <div class="facts">${facts.join("")}</div>
    ${r.details && r.details.length ? `<div style="display:flex;flex-direction:column;gap:8px"><h3>Good to know</h3><ul class="bul">${r.details.map(d => `<li>${esc(d)}</li>`).join("")}</ul></div>` : ""}
    <p class="source">Source: <a href="${esc(r.source)}" target="_blank" rel="noopener">${esc(r.source.replace(/^https?:\/\//, ""))}</a><br>Checked ${CHECKED}. Confirm with the office before you go.</p>`;
  mountSheet(inner, r.name);
  $("#saveBtn").addEventListener("click", (e) => {
    if (S.saved.has(r.id)) S.saved.delete(r.id); else S.saved.add(r.id);
    store.set("saved", [...S.saved]);
    const on = S.saved.has(r.id);
    e.currentTarget.textContent = on ? "★ Saved" : "☆ Save";
    e.currentTarget.setAttribute("aria-pressed", on);
    toast(on ? "Saved" : "Removed from Saved");
    if (S.view === "saved") renderView();
  });
}

function openCrisis() {
  const lines = [
    { l: "Emergency or immediate danger", n: "911", top: true },
    { l: "CAPS counseling, 24/7 for mental health emergencies", n: "479-575-5276", top: true },
    { l: "988 Suicide & Crisis Lifeline (call or text)", n: "988" },
    { l: "Crisis Text Line: text HOME to", n: "741741" },
    { l: "UAPD non-emergency (call or text)", n: "479-575-2222" },
    { l: "Safe Ride", n: "479-575-7233" }
  ];
  const inner = `
    <div class="sheet-top"><div style="display:flex;flex-direction:column;gap:6px"><span class="eyebrow">Help now</span><h2 style="font-size:24px">You don't have to handle this alone.</h2></div><button class="x" data-close aria-label="Close">×</button></div>
    <p class="muted">These lines are listed on official U of A pages. If you or someone else is in danger, call 911.</p>
    <div class="crisis-list">${lines.map(x => `<div class="crisis ${x.top ? "top" : ""}"><div style="display:flex;flex-direction:column;gap:2px;min-width:0"><span style="font-size:13.5px;font-weight:600">${esc(x.l)}</span><span class="num">${esc(x.n)}</span></div><button class="copy" data-copy="${esc(x.n)}">Copy</button></div>`).join("")}</div>
    <p class="source">Sources: <a href="https://health.uark.edu/mental-health/suicide-prevention.php" target="_blank" rel="noopener">health.uark.edu/mental-health/suicide-prevention.php</a>, <a href="https://uapd.uark.edu/" target="_blank" rel="noopener">uapd.uark.edu</a></p>`;
  mountSheet(inner, "Help now");
}

/* ===== Small UI helpers ===== */
let toastT;
function toast(msg) {
  let t = $(".toast");
  if (!t) { t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 1800);
}
function copy(text, btn) {
  const done = () => { btn.textContent = "Copied"; setTimeout(() => { btn.textContent = "Copy"; }, 1500); };
  try {
    navigator.clipboard.writeText(text).then(done, () => selectNear(btn));
  } catch (e) { selectNear(btn); }
}
function selectNear(btn) {
  const span = btn.parentElement.querySelector(".mono, .num");
  if (!span) return;
  const range = document.createRange(); range.selectNodeContents(span);
  const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
  toast("Selected. Press Ctrl+C or Cmd+C to copy.");
}

/* ===== Boot ===== */
const hash = (location.hash || "").replace("#", "");
if (NAV.some(n => n[0] === hash)) S.view = hash;
if (S.user) renderApp(); else renderLogin();
})();
</script>
